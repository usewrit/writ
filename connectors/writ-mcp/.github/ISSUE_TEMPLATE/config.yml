blank_issues_enabled: true
contact_links:
  - name: Tool behaviour, workflows, or the coordinator
    url: https://github.com/usewrit/writ/issues
    about: This connector holds no tool logic — anything about what a writ_* tool does, or about the coordinator itself, belongs in usewrit/writ.

  - name: The fleet agent (recording, replay, crawling)
    url: https://github.com/usewrit/writ-agent/issues
    about: Browser-side behaviour lives in the Rust worker.

  - name: Report a security vulnerability
    url: https://github.com/usewrit/writ-mcp/security/advisories/new
    about: Please report privately through GitHub Security Advisories — never as a public issue.
