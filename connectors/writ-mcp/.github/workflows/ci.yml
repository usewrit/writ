name: CI

# The whole package is one file plus its tests, so CI is short by design. What it
# has to prove is narrow and non-negotiable:
#   1. the wire behaviour is correct on every Node version the package claims;
#   2. the published tarball contains exactly what it should — this thing runs
#      inside the user's MCP client holding their API key, so a stray file or a
#      surprise dependency is a real security event, not an aesthetic one.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # package.json declares `engines.node: >=18`. Every version in that range is
    # tested, because "supported" with no build behind it is just a hope.
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["18", "20", "22", "24"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # `npm ci` and not `npm install`: the lockfile is committed and describes a
      # graph of exactly one package (this one). Installing from it proves the
      # graph is still empty; `npm install` would happily grow it.
      - name: Install (lockfile only — the graph is meant to be empty)
        run: npm ci

      - name: Test
        run: npm test

  package:
    name: Publish tarball
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # An over-broad `files` list, a missing LICENSE, or a stray node_modules is
      # caught here rather than after it is immutable on the registry.
      - name: Verify the publish tarball contains exactly the expected files
        run: |
          npm pack --dry-run --json > /tmp/pack.json
          node -e '
            const p = require("/tmp/pack.json")[0];
            const files = p.files.map(f => f.path).sort();
            const want = ["CHANGELOG.md", "LICENSE", "README.md", "index.js", "package.json"];
            const missing = want.filter(f => !files.includes(f));
            const extra = files.filter(f => !want.includes(f));
            if (missing.length) { console.error("missing from tarball:", missing); process.exit(1); }
            if (extra.length) { console.error("unexpected in tarball:", extra); process.exit(1); }
            console.log("tarball ok:", files.join(", "));
          '

      # Zero dependencies is the security posture, not a preference: there is no
      # transitive code in the process that holds the user's API key. Assert it
      # here as well as in the test suite so it cannot be lost by editing tests.
      - name: Assert the package stays dependency-free
        run: |
          node -e '
            const p = require("./package.json");
            for (const field of ["dependencies", "devDependencies", "optionalDependencies", "peerDependencies"]) {
              const v = p[field];
              if (v && Object.keys(v).length) {
                console.error(field + " is not empty: " + JSON.stringify(v));
                process.exit(1);
              }
            }
            console.log("dependency-free: ok");
          '

      - name: Audit
        run: npm audit --audit-level=low

  lint:
    name: Syntax + shebang
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # There is no linter and no build step — but `index.js` is an executable
      # installed onto the user's PATH by npm, so its shebang and its parseability
      # are load-bearing. `--check` parses without running (running it would block
      # on stdin forever).
      - name: Parse every source file
        run: |
          for f in index.js test/*.js; do node --check "$f"; done
          head -1 index.js | grep -qx '#!/usr/bin/env node' \
            || { echo "index.js must start with the node shebang — npm links it onto PATH"; exit 1; }

      - name: The binary must be executable
        run: test -x index.js || { echo "index.js is not executable"; exit 1; }
