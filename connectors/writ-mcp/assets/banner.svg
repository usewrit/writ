<svg width="1280" height="380" viewBox="0 0 1280 380" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="writ-mcp — the official Writ MCP server connector">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B0B0C"/>
      <stop offset="1" stop-color="#131316"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.86" cy="0.12" r="0.6">
      <stop offset="0" stop-color="#FF4A24" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#FF4A24" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#FFFFFF" fill-opacity="0.04"/>
    </pattern>
    <style>
      .sans { font-family: "Schibsted Grotesk", Inter, ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace; }
    </style>
  </defs>

  <rect width="1280" height="380" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="380" rx="20" fill="url(#dots)"/>
  <rect width="1280" height="380" rx="20" fill="url(#glow)"/>
  <rect x="1" y="1" width="1278" height="378" rx="19" fill="none" stroke="#FFFFFF" stroke-opacity="0.06"/>

  <!-- brand lockup: real WritTile (dark tile + handoff glyph + Signal bar) + wordmark -->
  <g transform="translate(80,84)">
    <rect width="132" height="132" rx="34" fill="#0A0C10" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <g transform="translate(14.5,14.5) scale(1.03)">
      <path d="M43 20 L58 11 V80 L43 89 V50 H20 V34 H43 Z" fill="#E9EBEF"/>
      <rect x="65" y="34" width="15" height="46" fill="#FF4A24"/>
    </g>
  </g>

  <!-- wordmark: the REAL brand wordmark, embedded as a data URI. It is raster,
       not text, on purpose: the vector wordmark draws through a foreignObject +
       an embedded @font-face, and GitHub renders README SVGs as <img>, where
       both are dropped — the mark would vanish. -->
  <image x="244" y="93" width="251" height="114" href="data:image/png;base64,"/>

  <!-- the repository this banner belongs to: the MCP connector -->
  <g transform="translate(535,127)">
    <rect width="90" height="46" rx="12" fill="#FF4A24" fill-opacity="0.14" stroke="#FF4A24" stroke-opacity="0.45"/>
    <text x="45" y="30" class="mono" font-size="20" text-anchor="middle" fill="#FF7A5C">mcp</text>
  </g>

  <!-- tagline -->
  <text x="82" y="290" class="sans" font-size="30" font-weight="600" fill="#E4E4E7">Your saved workflows, as callable tools.</text>
  <text x="82" y="328" class="sans" font-size="21" fill="#8A8A93">A zero-dependency stdio bridge to Writ Cloud or your own coordinator.</text>

  <!-- capability chips -->
  <g class="mono" font-size="16" fill="#C9C9CF">
    <g transform="translate(742,116)">
      <rect width="164" height="38" rx="10" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.08"/>
      <text x="82" y="25" text-anchor="middle">Claude Code</text>
    </g>
    <g transform="translate(918,116)">
      <rect width="198" height="38" rx="10" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.08"/>
      <text x="99" y="25" text-anchor="middle">Claude Desktop</text>
    </g>
    <g transform="translate(742,166)">
      <rect width="110" height="38" rx="10" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.08"/>
      <text x="55" y="25" text-anchor="middle">Cursor</text>
    </g>
    <g transform="translate(864,166)">
      <rect width="252" height="38" rx="10" fill="#FF4A24" fill-opacity="0.14" stroke="#FF4A24" stroke-opacity="0.45"/>
      <text x="126" y="25" text-anchor="middle" fill="#FF7A5C">zero dependencies</text>
    </g>
  </g>

  <!-- terminal hint -->
  <g transform="translate(742,236)">
    <rect width="374" height="66" rx="12" fill="#000000" fill-opacity="0.35" stroke="#FFFFFF" stroke-opacity="0.07"/>
    <circle cx="20" cy="20" r="4" fill="#FF5F57"/><circle cx="36" cy="20" r="4" fill="#FEBC2E"/><circle cx="52" cy="20" r="4" fill="#28C840"/>
    <text x="20" y="50" class="mono" font-size="16" fill="#B8B8BF"><tspan fill="#FF7A5C">$</tspan> npx -y writ-mcp</text>
  </g>

  <text x="1200" y="352" class="mono" font-size="14" text-anchor="end" fill="#5A5A62">MIT · Node 18+ · no dependencies</text>
</svg>
