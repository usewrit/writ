<svg width="1000" height="348" viewBox="0 0 1000 348" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Terminal: claude mcp add writ-selfhost, then claude mcp list showing Connected">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1000" y2="348" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B0B0C"/>
      <stop offset="1" stop-color="#131316"/>
    </linearGradient>
    <style>
      .t   { font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace; font-size: 14px; }
      .p   { fill: #FF7A5C; }
      .c   { fill: #E4E4E7; }
      .o   { fill: #C9C9CF; }
      .d   { fill: #8A8A93; }
      .n   { fill: #E4E4E7; font-weight: 600; }
      .g   { fill: #4ADE80; }
      .cur { fill: #FF7A5C; animation: blink 1.1s steps(1,end) infinite; }
      @keyframes blink { 0%,50% { opacity: 1 } 50.01%,100% { opacity: 0 } }
    @keyframes r0{0%,3.08%{opacity:0}5.00%,95.38%{opacity:1}100%{opacity:0}}
    @keyframes r1{0%,3.08%{opacity:0}5.00%,95.38%{opacity:1}100%{opacity:0}}
    @keyframes r2{0%,13.85%{opacity:0}15.77%,95.38%{opacity:1}100%{opacity:0}}
    @keyframes r3{0%,18.46%{opacity:0}20.38%,95.38%{opacity:1}100%{opacity:0}}
    @keyframes r4{0%,21.54%{opacity:0}23.46%,95.38%{opacity:1}100%{opacity:0}}
    @keyframes r5{0%,32.31%{opacity:0}34.23%,95.38%{opacity:1}100%{opacity:0}}
    @keyframes r6{0%,35.38%{opacity:0}37.31%,95.38%{opacity:1}100%{opacity:0}}
    @keyframes r7{0%,43.08%{opacity:0}45.00%,95.38%{opacity:1}100%{opacity:0}}
    @keyframes r8{0%,50.77%{opacity:0}52.69%,95.38%{opacity:1}100%{opacity:0}}
    @keyframes r9{0%,53.85%{opacity:0}55.77%,95.38%{opacity:1}100%{opacity:0}}
    </style>
  </defs>

  <rect width="1000" height="348" rx="14" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="999" height="347" rx="13.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.07"/>
  <line x1="0" y1="41" x2="1000" y2="41" stroke="#FFFFFF" stroke-opacity="0.06"/>
  <circle cx="26" cy="21" r="5" fill="#FF5F57"/>
  <circle cx="46" cy="21" r="5" fill="#FEBC2E"/>
  <circle cx="66" cy="21" r="5" fill="#28C840"/>
  <text x="500" y="26" class="t" font-size="12" text-anchor="middle" fill="#6B6B73">writ-mcp — connect an MCP client to your coordinator</text>

  <g style="animation:r0 13s steps(1,end) infinite">
    <text x="26" y="62" class="t" xml:space="preserve"><tspan class="p">$ </tspan><tspan class="c">claude mcp add writ-selfhost -e WRIT_API_KEY=$WRIT_API_KEY \</tspan></text>
  </g>
  <g style="animation:r1 13s steps(1,end) infinite">
    <text x="26" y="88" class="t" xml:space="preserve"><tspan class="c">    -- npx -y writ-mcp --url http://localhost:8199</tspan></text>
  </g>
  <g style="animation:r2 13s steps(1,end) infinite">
    <text x="26" y="114" class="t" xml:space="preserve"><tspan class="o">Added stdio MCP server writ-selfhost to local config</tspan></text>
  </g>
  <g style="animation:r3 13s steps(1,end) infinite">
    <text x="26" y="140" class="t" xml:space="preserve"> </text>
  </g>
  <g style="animation:r4 13s steps(1,end) infinite">
    <text x="26" y="166" class="t" xml:space="preserve"><tspan class="p">$ </tspan><tspan class="c">claude mcp list</tspan></text>
  </g>
  <g style="animation:r5 13s steps(1,end) infinite">
    <text x="26" y="192" class="t" xml:space="preserve"><tspan class="d">Checking MCP server health...</tspan></text>
  </g>
  <g style="animation:r6 13s steps(1,end) infinite">
    <text x="26" y="218" class="t" xml:space="preserve"> </text>
  </g>
  <g style="animation:r7 13s steps(1,end) infinite">
    <text x="26" y="244" class="t" xml:space="preserve"><tspan class="n">writ-selfhost</tspan><tspan class="d">: npx -y writ-mcp --url http://localhost:8199 - </tspan><tspan class="g">✓ Connected</tspan></text>
  </g>
  <g style="animation:r8 13s steps(1,end) infinite">
    <text x="26" y="270" class="t" xml:space="preserve"> </text>
  </g>
  <g style="animation:r9 13s steps(1,end) infinite">
    <text x="26" y="296" class="t" xml:space="preserve"><tspan class="p">$ </tspan></text>
    <rect class="cur" x="43.8" y="285" width="8" height="15" rx="1"/>
  </g>
</svg>
