# mypy config for the backend — non-strict / targeted START (WS: CI hardening).
#
# Standalone mypy.ini (no backend/pyproject.toml exists) keeps the one-file-per-
# tool convention used by pytest.ini / ruff.toml. Run by the ADVISORY `quality`
# job in .github/workflows/ci.yml (continue-on-error until the board is green):
#   mypy --config-file mypy.ini .   (working-directory: coordinator)
#
# Philosophy: green TODAY, ratchet toward strict per-module over time. The board
# is a real gate, but we deliberately do NOT enable the full strict suite yet —
# instead we turn on a small high-signal set and silence missing third-party
# stubs so untyped deps don't drown out real findings.

[mypy]
python_version = 3.11

# The app runs with the coordinator directory itself on sys.path (main.py does
# `import config`, `import utils.redis_client`, …), so mypy has to resolve
# modules the same way or it sees utils/redis_client.py under two names and
# aborts before checking anything.
mypy_path = .
explicit_package_bases = True
namespace_packages = True

# High-signal checks that catch real bugs without demanding full annotations.
warn_redundant_casts = True
warn_unused_ignores = True
warn_unreachable = True
warn_return_any = True
no_implicit_optional = True
check_untyped_defs = True

# Do NOT require every function to be annotated yet (would be a huge red board).
# Flip these on per-module as files get typed:
#   disallow_untyped_defs = True
disallow_untyped_defs = False
ignore_missing_imports = True

# `ignore_missing_imports` covers a module mypy cannot find at all, but NOT a
# module it finds and discovers is unannotated (redis.asyncio, bs4, …). Without
# this, third-party packages that simply never shipped stubs produce noise that
# has nothing to do with our code.
disable_error_code = import-untyped

# Generated migrations and vendored trees are out of scope.
exclude = (?x)(
    ^alembic/versions/
    | /__pycache__/
    | ^logs/
    | ^worker-templates/
  )

# Per-module ratchet examples — UNCOMMENT to enforce strict typing as modules
# are cleaned up (keeps the gate moving toward strict without one big bang):
# [mypy-security.*]
# disallow_untyped_defs = True

# Tests are intentionally loose (fixtures, monkeypatching, dynamic attrs).
[mypy-tests.*]
check_untyped_defs = False
disallow_untyped_defs = False
