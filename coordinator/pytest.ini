[pytest]
# Backend test suite config.
#
# rootdir is backend/; run from there with `pytest` (or `python -m pytest`).
# testpaths keeps collection to the tests/ dir (the rest of the tree is app code,
# some of which has module-level side effects we don't want pytest importing).
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# asyncio_mode=auto so bare `async def test_*` (e.g. test_agent_state_manager.py)
# run without each needing an explicit @pytest.mark.asyncio decorator. The
# script-style suites that drive their own event loop via asyncio.run() inside a
# sync test function keep working unchanged.
asyncio_mode = auto

# Run the whole session on ONE event loop so the session-scoped async fixtures in
# conftest (db_engine) and the function-scoped async tests/fixtures (db_session)
# share a loop — otherwise asyncpg connections get "attached to a different loop"
# on teardown. Requires pytest-asyncio>=0.23 (the loop-scope model).
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session

# Quieter, deterministic output. -ra surfaces skip/xfail reasons (the ephemeral
# Postgres fixture skips loudly when no DB is reachable — see conftest.py).
addopts = -ra --strict-markers

markers =
    db: test requires a live Postgres (skipped automatically when none is reachable)
    slow: test is slow; deselect with -m "not slow"
